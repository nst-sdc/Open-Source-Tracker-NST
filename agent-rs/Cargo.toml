[package]
name = "agent-rs"
version = "0.1.0"
edition = "2021"
description = "Read-only OSS assistant agent sidecar: BM25 RAG + capped tool-dispatch loop"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
