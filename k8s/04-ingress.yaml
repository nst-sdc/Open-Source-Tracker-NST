# No TLS config needed here — public HTTPS is handled entirely by the
# cluster's Cloudflare Tunnel + wildcard *.nstsdc.org DNS. See
# docs/DEPLOYMENT.md and nst-sdc/nst-cluster-docs' tutorial-public-url.md.
#
# Before adding a hostname: confirm it isn't already taken —
#   kubectl get ingress -A
#
# Two hostnames. os.nstsdc.org is the address (short, easy to remember).
# oss-tracker.nstsdc.org was the address until 2026-11-20 and links to it
# are out in the world, so it stays served and sends every request to the
# same path on os.nstsdc.org with a permanent redirect (query string kept,
# so a GitHub OAuth callback registered on the old host still completes).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensource-tracker
  namespace: opensource-tracker
spec:
  ingressClassName: traefik
  rules:
    - host: os.nstsdc.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensource-tracker
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-os
  namespace: opensource-tracker
spec:
  redirectRegex:
    regex: "^https?://oss-tracker\\.nstsdc\\.org/(.*)"
    replacement: "https://os.nstsdc.org/${1}"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensource-tracker-legacy-host
  namespace: opensource-tracker
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: opensource-tracker-redirect-to-os@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: oss-tracker.nstsdc.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensource-tracker
                port:
                  number: 80
