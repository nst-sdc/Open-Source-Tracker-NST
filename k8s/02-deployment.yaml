# Kubernetes Deployment for the NST SDC cluster (rancher.nstsdc.org).
# See docs/DEPLOYMENT.md for the full step-by-step walkthrough.
#
# Image is pushed to ghcr.io/nst-sdc/open-source-tracker-nst. Ideally this
# happens automatically via .github/workflows/build-and-push.yml on every
# push to main — but that requires the nst-sdc org's Actions "Workflow
# permissions" to be set to Read and write (org Settings > Actions >
# General); until an org owner does that, the workflow will fail trying to
# push, and the image needs to be built+pushed manually instead.
#
# The `image:` tag below MUST be a specific build (short git SHA), never
# `latest`. Real incident: this file used to pin `:latest`, a routine
# `kubectl apply -f 02-deployment.yaml` (to pick up an unrelated replicas/
# resources change) silently reset the running container back to whatever
# `:latest` happened to point at, wiping out a deploy that had actually been
# reviewed and tested. Every manual deploy in this repo's history has used
# `kubectl set image deployment/opensource-tracker opensource-tracker=<tag>`
# with the short SHA from `git log`, which does NOT update this file — so
# after every such deploy, also update the tag below to match, or the next
# `kubectl apply` here will revert it again. (If build-and-push.yml is ever
# turned on, note it tags with the *full* `github.sha`, not the short SHA
# used everywhere manually so far — reconcile that before relying on it.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensource-tracker
  namespace: opensource-tracker
  labels:
    app: opensource-tracker
spec:
  # Baseline replica count; the HPA in 06-hpa.yaml takes over scaling from
  # here once applied. Kept in sync with that file's minReplicas so this
  # value is still correct if the HPA is ever removed.
  replicas: 3
  selector:
    matchLabels:
      app: opensource-tracker
  template:
    metadata:
      labels:
        app: opensource-tracker
    spec:
      containers:
        - name: opensource-tracker
          image: ghcr.io/nst-sdc/open-source-tracker-nst:1ee049d
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: opensource-tracker-secrets
          env:
            # This only bounds the incremental-refresh CronJob (05-refresh-
            # cronjob.yaml), which calls the in-cluster Service directly and
            # never touches the Cloudflare Tunnel's ~100s proxy limit — so
            # this is set close to that Job's own ceiling instead
            # (curl --max-time 160 / activeDeadlineSeconds 170), maximizing
            # how many students a single token can get through per tick.
            # A manual refresh through the public site still goes through
            # Cloudflare and can still 524 client-side even though the
            # server-side work completes moments later — see
            # lib/github.ts's TICK_DEADLINE_MS comment for that history.
            - name: TICK_DEADLINE_MS
              value: "150000"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          # Raised from the original 100m/500m request/limit after measuring
          # real CPU throttling in production use: rendering the ~1,900-student
          # leaderboard page is CPU-heavy (large JSON parse + big React tree),
          # and cgroup stats (cat /sys/fs/cgroup/cpu.stat inside the pod) showed
          # the container spending more time throttled than actually running
          # at the old 500m limit. See docs/DEPLOYMENT.md for how to check this
          # yourself if pages feel slow again after scaling up the roster.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
      # The GHCR package is currently private (visibility toggle wasn't
      # cooperating via the GitHub UI at deploy time — worth revisiting and
      # removing this block if it's ever confirmed public). See
      # docs/DEPLOYMENT.md for how this Secret gets created.
      imagePullSecrets:
        - name: ghcr-pull-secret
