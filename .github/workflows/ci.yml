name: CI

# Typecheck, unit tests and a production build on every pull request, so a
# branch that does not compile is caught before anyone opens its preview or
# reviews it by hand.
#
# Deliberately needs no secrets: the build runs with no KV credentials, which
# lib/kv.ts handles by falling back to disk. That keeps this workflow working
# for pull requests opened from forks, where secrets are withheld.

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # Secret scanning over the full history.
  #
  # This runs the gitleaks BINARY rather than gitleaks/gitleaks-action, and
  # that is deliberate. The action is license-gated: on an organisation
  # account it refuses to run at all with "missing gitleaks license", and on
  # a personal account it additionally needs a GITHUB_TOKEN for pull
  # requests. Between the two, this job had never once completed a scan on a
  # pull request in this repository -- it failed before reading any code, so
  # a green tick here meant nothing. The scanner itself is MIT-licensed and
  # free, needs no token and no secrets, and so also works on pull requests
  # from forks.
  #
  # Findings that are known false positives live in .gitleaksignore, keyed by
  # exact fingerprint so a new finding in the same file still fails.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pinned rather than "latest" so a rule change upstream cannot fail
          # an unrelated pull request without anyone choosing to take it.
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: gitleaks git --redact --no-banner --exit-code 1
